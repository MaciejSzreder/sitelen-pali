<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IloPiSitelenPali in the browser</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Inter, Segoe UI, sans-serif; margin: 0; background: #07111f; color: #f8fafc; }
    main { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    .card { background: #10233d; border: 1px solid #213552; border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
    textarea, button { width: 100%; padding: 0.8rem; border-radius: 10px; border: 1px solid #334155; font: inherit; }
    textarea { min-height: 8rem; background: #0f172a; color: #f8fafc; }
    button { margin-top: 0.75rem; background: #0284c7; color: white; cursor: pointer; }
    pre { white-space: pre-wrap; background: #020617; padding: 1rem; border-radius: 10px; overflow-x: auto; }
    .hint { color: #7dd3fc; font-size: 0.95rem; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>IloPiSitelenPali in the browser</h1>
    <p class="hint">This page launches the compiled Java entry point through CheerpJ.</p>

    <div class="card">
      <label for="input">Sample input</label>
      <textarea id="input">mi jan pona</textarea>
      <button onclick="runDemo()">Run with CheerpJ</button>
    </div>

    <div class="card">
      <h2>Output</h2>
      <pre id="output">Waiting to launch…</pre>
    </div>
  </main>

  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <script>
    let ready = false;

    async function ensureCheerpJ() {
      if (ready) return;
      await cheerpjInit({ version: 17, status: 'none' });
      ready = true;
    }

    async function createInputFile(content) {
      // Create file in /str/ filesystem
      const strPath = '/str/input.txt';
      cheerpOSAddStringFile(strPath, content);
      return strPath;
    }

    async function captureConsole(action) {
      const capturedOutput = [];
      const originalConsoleLog = console.log;
      const originalConsoleError = console.error;
      
      console.log = function(...args) {
        capturedOutput.push({ type: 'log', message: args.map(arg => 
          typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
        ).join(' ') });
      };
      
      console.error = function(...args) {
        capturedOutput.push({ type: 'error', message: args.map(arg => 
          typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
        ).join(' ') });
      };
      
      try {
        await action();
      } finally {
        console.log = originalConsoleLog;
        console.error = originalConsoleError;
      }
      
      return capturedOutput.map(entry => {
        const prefix = entry.type === 'error' ? 'ERROR: ' : '';
        return prefix + entry.message;
      }).join('\n');
    }

    async function runDemo() {
      const output = document.getElementById('output');
      const input = document.getElementById('input').value;
      
      if (!input.trim()) {
        output.textContent = 'Please enter some text in the input area.';
        return;
      }

      output.textContent = 'Starting CheerpJ…';

      try {
        await ensureCheerpJ();
        output.textContent = 'Creating input file…';
        
        const inputFilePath = await createInputFile(input);
        output.textContent = 'Launching IloPiSitelenPali with input file…';
        
        // Capture console output while running the Java application
        const capturedText = await captureConsole(async () => {
          await cheerpjRunMain('IloPiSitelenPali', '/app/sitelen-pali/IloPiSitelenPali.jar', '--input', inputFilePath);
        });
        
        // Display the captured output
        if (capturedText.trim()) {
          output.textContent = capturedText;
        } else {
          output.textContent = 'IloPiSitelenPali completed. No output was captured.';
        }
      } catch (error) {
        const message = typeof error === 'string' ? error : (error && error.message) ? error.message : String(error);
        output.textContent = 'CheerpJ could not start the Java app: ' + message;
      }
    }

    window.addEventListener('load', () => {
      ensureCheerpJ().catch((error) => {
        const message = typeof error === 'string' ? error : (error && error.message) ? error.message : String(error);
        document.getElementById('output').textContent = 'CheerpJ initialization failed: ' + message;
      });
    });
  </script>
</body>
</html>
