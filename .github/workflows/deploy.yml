name: Build and Deploy with CheerpJ

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Maven
      run: mvn clean package
        
    - name: Download JUnit Platform Console Standalone
      run: curl -L -o target/junit-platform-console-standalone.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
        
    - name: Create deployment structure
      run: |
        mkdir -p deploy
        cp target/IloPiSitelenPali.jar deploy/
        cp target/sitelen-pali-1.0-SNAPSHOT-Test.jar deploy/IloPiSitelenPaliTest.jar
        cp target/junit-platform-console-standalone.jar deploy/
        cp index.html deploy/
        cp tests.html deploy/
        cp styles.css deploy/
        cp common.js deploy/
        cp app.js deploy/
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy/

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
